# Stack completa para validação local de observabilidade.
# Uso: docker compose -f docker-compose.local.yml --env-file .env.dev up --build
#
# UIs disponíveis após subir:
#   Grafana    → http://localhost:3000  (admin / admin)
#   Prometheus → http://localhost:9090
#   Tempo      → http://localhost:3200  (API only)
#
# Fluxo de dados:
#   Serviços ──OTLP/gRPC──▶ otelcol ──▶ tempo   (traces)
#                                    └──▶ prometheus (métricas via endpoint)
#   Tempo ──remote_write──▶ prometheus  (service-graph + span metrics)
#   Docker logs ──▶ promtail ──▶ loki
#   Grafana ◀── prometheus / loki / tempo

services:

  # ── Observabilidade ───────────────────────────────────────────────────────

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: otelcol
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./local/observability/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (serviços enviam aqui)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint (métricas dos serviços)
      - "8888:8888"   # Métricas internas do collector
    networks:
      - local-network
    depends_on:
      tempo:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.4.2
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./local/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # HTTP API
      - "9095:9095"   # gRPC (Grafana 11.x usa gRPC para queries TraceQL)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - local-network
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"   # Recebe remote_write do Tempo
    volumes:
      - ./local/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - local-network

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./local/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - local-network

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./local/observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - local-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor metricsSummary"
    volumes:
      - ./local/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - local-network
    depends_on:
      - prometheus
      - loki
      - tempo

  # ── Infraestrutura ────────────────────────────────────────────────────────

  ngo-db:
    image: postgres:16-alpine
    container_name: ngo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER_NGO_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_NGO_DB}
      POSTGRES_DB: ${POSTGRES_DB_NGO_DB}
    volumes:
      - ngo-db-data:/var/lib/postgresql/data
      - ./local/services/ngo-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_NGO_DB} -d ${POSTGRES_DB_NGO_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - local-network

  donation-db:
    image: postgres:16-alpine
    container_name: donation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER_DONATION_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DONATION_DB}
      POSTGRES_DB: ${POSTGRES_DB_DONATION_DB}
    volumes:
      - donation-db-data:/var/lib/postgresql/data
      - ./local/services/donation-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_DONATION_DB} -d ${POSTGRES_DB_DONATION_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - local-network

  localstack:
    image: localstack/localstack:3.8.1
    container_name: solidarytech-localstack
    restart: unless-stopped
    environment:
      - SERVICES=sqs,dynamodb
      - DEFAULT_REGION=us-east-1
      - SQS_ENDPOINT_STRATEGY=path
    volumes:
      - ./local/observability/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"running\"\\|\"available\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - local-network

  # ── Microsserviços ────────────────────────────────────────────────────────

  ngo-service:
    build:
      context: ./local/services/ngo-service
    pull_policy: never
    container_name: ngo-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER_NGO_DB}:${POSTGRES_PASSWORD_NGO_DB}@ngo-db:5432/${POSTGRES_DB_NGO_DB}?sslmode=disable"
      PORT: ${PORT_NGO_SERVICE}
      OTEL_SERVICE_NAME: "ngo-service"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcol:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "${PORT_NGO_SERVICE}:${PORT_NGO_SERVICE}"
    depends_on:
      ngo-db:
        condition: service_healthy
      otelcol:
        condition: service_started
    networks:
      - local-network

  donation-service:
    build:
      context: ./local/services/donation-service
    pull_policy: never
    container_name: donation-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER_DONATION_DB}:${POSTGRES_PASSWORD_DONATION_DB}@donation-db:5432/${POSTGRES_DB_DONATION_DB}?sslmode=disable"
      PORT: ${PORT_DONATION_SERVICE}
      AWS_REGION: ${AWS_REGION}
      AWS_SQS_URL: ${AWS_SQS_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: "otelcol:4317"
    ports:
      - "${PORT_DONATION_SERVICE}:${PORT_DONATION_SERVICE}"
    depends_on:
      donation-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      otelcol:
        condition: service_started
    networks:
      - local-network

  volunteer-service:
    build:
      context: ./local/services/volunteer-service
    pull_policy: never
    container_name: volunteer-service
    restart: unless-stopped
    environment:
      PORT: ${PORT_VOLUNTEER_SERVICE}
      AWS_REGION: ${AWS_REGION}
      AWS_DYNAMODB_TABLE: ${AWS_DYNAMODB_TABLE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      OTEL_SERVICE_NAME: "volunteer-service"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcol:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "${PORT_VOLUNTEER_SERVICE}:${PORT_VOLUNTEER_SERVICE}"
    depends_on:
      localstack:
        condition: service_healthy
      otelcol:
        condition: service_started
    networks:
      - local-network

volumes:
  ngo-db-data:
  donation-db-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  local-network:
    driver: bridge
